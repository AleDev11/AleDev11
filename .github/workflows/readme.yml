name: Update README

# Regenera los SVG cada mes para que los contadores (años, duración en Infini)
# se actualicen solos. Solo hace commit si algo ha cambiado.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python scripts/build.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "Alejandro Font Muñiz"
          git config user.email "91348432+AleDev11@users.noreply.github.com"
          git add assets
          git commit -m "Update README counters"
          git push
