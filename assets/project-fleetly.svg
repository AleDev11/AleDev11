<svg xmlns="http://www.w3.org/2000/svg" width="488" height="300" viewBox="0 0 488 300" role="img" aria-label="Fleetly — Company portal for internal fleet management, with a separate administration panel.">
<title>Fleetly — Company portal for internal fleet management, with a separate administration panel.</title>
<defs>
<style>
@font-face{font-family:'b4';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'d9';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'l5';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'l6';src:url(data:font/woff2;base64,) format('woff2');}
text{font-kerning:normal}
@keyframes sw{0%{transform:translateX(-160px)}60%,100%{transform:translateX(488px)}}.sw{animation:sw 4.5s cubic-bezier(0.65,0,0.35,1) infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}.dot{animation:blink 2.4s ease-in-out infinite}@keyframes arr{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}.arr{animation:arr 1.8s ease-in-out infinite}@keyframes pin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.pin{animation:pin .9s cubic-bezier(0.16, 1, 0.3, 1) both}
@keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes chl{0%,6%,100%{stroke:#2a2a2a;fill:#0a0a0a}2%,4%{stroke:#ff6b00;fill:#2a1405}}@keyframes cth{0%,6%,100%{fill:#b0b0b0}2%,4%{fill:#ffffff}}.chip{animation:cin .6s cubic-bezier(0.16, 1, 0.3, 1) both}.chip .cr{animation:chl 6s linear infinite}.chip .ct{animation:cth 6s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<linearGradient id="sg"><stop offset="0" stop-color="#ff6b00" stop-opacity="0"/><stop offset=".5" stop-color="#ff6b00"/><stop offset="1" stop-color="#ff6b00" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="487" height="299" fill="#111111" stroke="#2a2a2a"/>
<rect x="1" y="1" width="486" height="2" fill="#2a2a2a"/>
<rect class="sw" x="0" y="1" width="160" height="2" fill="url(#sg)"/>
<text x="470.0" y="290.0" font-family="d9" font-size="170" fill="#161616" text-anchor="end">03</text>
<g class="pin">
<text x="28.0" y="50.0" font-family="d9" font-size="22" fill="#ff6b00">03</text>
<text x="58.1" y="49.0" font-family="d9" font-size="16" fill="#7a2e00" letter-spacing="-0.80">///</text>
<circle class="dot" cx="422.76" cy="45" r="4" fill="#25d366"/>
<text x="460.0" y="49.0" font-family="l5" font-size="11" fill="#b0b0b0" letter-spacing="1.80" text-anchor="end">LIVE</text>
<text x="28.0" y="112.0" font-family="d9" font-size="48" fill="#ffffff" letter-spacing="0.40">FLEETLY</text>
<text x="28.0" y="146.0" font-family="b4" font-size="14.5" fill="#cccccc">Company portal for internal fleet management, with a</text>
<text x="28.0" y="169.0" font-family="b4" font-size="14.5" fill="#cccccc">separate administration panel.</text>
</g>
<g class="chip" style="animation-delay:0.40s">
<rect class="cr" style="animation-delay:1.20s" x="28.0" y="206" width="90.6" height="30" rx="4" fill="#0a0a0a" stroke="#2a2a2a"/>
<text x="40.0" y="225.5" font-family="l5" font-size="11.5" fill="#b0b0b0" letter-spacing="1.40" class="ct" style="animation-delay:1.20s">TYPESCRIPT</text>
</g>
<g class="chip" style="animation-delay:0.48s">
<rect class="cr" style="animation-delay:1.50s" x="126.6" y="206" width="58.1" height="30" rx="4" fill="#0a0a0a" stroke="#2a2a2a"/>
<text x="138.6" y="225.5" font-family="l5" font-size="11.5" fill="#b0b0b0" letter-spacing="1.40" class="ct" style="animation-delay:1.50s">REACT</text>
</g>
<g class="chip" style="animation-delay:0.56s">
<rect class="cr" style="animation-delay:1.80s" x="192.8" y="206" width="94.6" height="30" rx="4" fill="#0a0a0a" stroke="#2a2a2a"/>
<text x="204.8" y="225.5" font-family="l5" font-size="11.5" fill="#b0b0b0" letter-spacing="1.40" class="ct" style="animation-delay:1.80s">POSTGRESQL</text>
</g>
<line x1="28" y1="256" x2="460" y2="256" stroke="#2a2a2a"/>
<text x="28.0" y="281.0" font-family="l6" font-size="12" fill="#ff6b00" letter-spacing="2.00">VIEW LIVE</text>
<g class="arr"><path d="M98.6 281 l8 -8 M100.6 273 h6 v6" stroke="#ff6b00" stroke-width="1.8" fill="none"/></g>
<text x="460.0" y="281.0" font-family="l5" font-size="11" fill="#555555" letter-spacing="1.60" text-anchor="end">FLEETLY.AFONT.DEV</text>
