@keyframes up{from{transform:translateY(110%)}to{transform:none}}.up{transform-box:fill-box;animation:up 1.1s cubic-bezier(0.16, 1, 0.3, 1) both}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fade{animation:fade .9s cubic-bezier(0.16, 1, 0.3, 1) both}@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}.draw{transform-box:fill-box;transform-origin:left;animation:draw 1.4s cubic-bezier(0.16, 1, 0.3, 1) both}
@keyframes rot{0.00%,21.00%{transform:translateY(0.0px)}25.00%,46.00%{transform:translateY(-187.5px)}50.00%,71.00%{transform:translateY(-375.0px)}75.00%,96.00%{transform:translateY(-562.5px)}100%{transform:translateY(-750.0px)}}.rot{animation:rot 12s cubic-bezier(0.76, 0, 0.24, 1) 1s infinite}
