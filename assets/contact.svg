<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Got a project in mind? Let's talk — fontalejandro0@gmail.com">
<title>Got a project in mind? Let's talk — fontalejandro0@gmail.com</title>
<defs>
<style>
@font-face{font-family:'b5';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'d9';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'l6';src:url(data:font/woff2;base64,) format('woff2');}
text{font-kerning:normal}
@keyframes dg{to{transform:translateX(-56px)}}.dgm{animation:dg 3s linear infinite}@keyframes cu{from{transform:translateY(90px)}to{transform:none}}.cu{animation:cu 1s cubic-bezier(0.16, 1, 0.3, 1) both}@keyframes cf{from{opacity:0}to{opacity:1}}.cf{animation:cf 1s cubic-bezier(0.16, 1, 0.3, 1) both}@keyframes big{0%,100%{transform:rotate(45deg)}50%{transform:rotate(55deg)}}.big{animation:big 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<pattern id="dg" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="4" height="14" fill="#cc4e00" opacity=".35"/></pattern>
<clipPath id="rc"><rect x="640" y="0" width="360" height="300"/></clipPath>
<clipPath id="c1"><rect x="0" y="82" width="700" height="84"/></clipPath>
<clipPath id="c2"><rect x="0" y="160" width="700" height="80"/></clipPath>
</defs>
<rect width="1000" height="300" fill="#ff6b00"/>
<g clip-path="url(#rc)"><g class="dgm"><rect x="640" y="0" width="420" height="300" fill="url(#dg)"/></g></g>
<g clip-path="url(#rc)"><rect class="big" x="760" y="80" width="140" height="140" fill="#0a0a0a"/></g>
<g class="cf" style="animation-delay:.1s">
<rect x="56" y="48" width="94.2" height="28" fill="none" stroke="#0a0a0a" stroke-width="2"/>
<text x="67.0" y="67.0" font-family="l6" font-size="12" fill="#0a0a0a" letter-spacing="2.20">LET'S TALK</text>
</g>
<g clip-path="url(#c1)">
<text x="52.0" y="152.0" font-family="d9" font-size="84" fill="#0a0a0a" letter-spacing="-1.00" class="cu" style="animation-delay:.2s">GOT A PROJECT</text>
</g><g clip-path="url(#c2)">
<text x="52.0" y="228.0" font-family="d9" font-size="84" fill="#0a0a0a" letter-spacing="-1.00" class="cu" style="animation-delay:.35s">IN MIND?</text>
</g>
<g class="cf" style="animation-delay:.8s">
<text x="56.0" y="266.0" font-family="b5" font-size="15" fill="#0a0a0a">Tell me what you need — I'll get back to you within 24 hours.</text>
</g>
</svg>
