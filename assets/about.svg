<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="398" viewBox="0 0 1000 398" role="img" aria-label="About me">
<title>About me</title>
<defs>
<style>
@font-face{font-family:'b4';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'b5';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'d9';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'l5';src:url(data:font/woff2;base64,) format('woff2');}
text{font-kerning:normal}
@keyframes hd{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.hd{animation:hd .8s cubic-bezier(0.16, 1, 0.3, 1) both}
@keyframes ln{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}.ln{animation:ln .8s cubic-bezier(0.16, 1, 0.3, 1) both}@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}.dot{animation:blink 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

</defs>
<rect x="0.5" y="0.5" width="999" height="397" fill="#0a0a0a" stroke="#2a2a2a"/>
<g class="hd" style="animation-delay:0.0s">
<text x="48.0" y="74.0" font-family="d9" font-size="44" fill="#ffffff" letter-spacing="0.40">ABOUT ME</text>
<rect x="236" y="58" width="716" height="3" fill="#2a2a2a"/>
</g>
<g class="ln" style="animation-delay:0.30s">
<text x="48" y="130" font-family="b4" font-size="16" fill="#cccccc">I work as a developer at <tspan font-family="b5" fill="#ffffff">Infini</tspan>, a Barcelona-based consultancy</text>
</g>
<g class="ln" style="animation-delay:0.36s">
<text x="48.0" y="158.0" font-family="b4" font-size="16" fill="#cccccc">specialising in intelligent automation and AI. Day to day I build</text>
</g>
<g class="ln" style="animation-delay:0.42s">
<text x="48.0" y="186.0" font-family="b4" font-size="16" fill="#cccccc">management platforms, develop web applications, create AI agents</text>
</g>
<g class="ln" style="animation-delay:0.48s">
<text x="48.0" y="214.0" font-family="b4" font-size="16" fill="#cccccc">and automate processes with RPA.</text>
</g>
<g class="ln" style="animation-delay:0.60s">
<text x="48.0" y="270.0" font-family="b4" font-size="16" fill="#cccccc">I've worked on international projects with clients in the Middle East —</text>
</g>
<g class="ln" style="animation-delay:0.66s">
<text x="48.0" y="298.0" font-family="b4" font-size="16" fill="#cccccc">every project is from a different sector, so no two weeks are alike.</text>
</g>
<g class="ln" style="animation-delay:0.72s">
<text x="48.0" y="326.0" font-family="b4" font-size="16" fill="#cccccc">What motivates me most is seeing what I build actually work and make</text>
</g>
<g class="ln" style="animation-delay:0.78s">
<text x="48.0" y="354.0" font-family="b4" font-size="16" fill="#cccccc">someone's life easier.</text>
</g>
<line x1="610" y1="104" x2="610" y2="344" stroke="#1f1f1f"/>
<g class="ln" style="animation-delay:0.50s">
<text x="640.0" y="134.0" font-family="l5" font-size="10.5" fill="#888888" letter-spacing="2.00">LOCATION</text>
<text x="750.0" y="135.0" font-family="b5" font-size="14" fill="#ffffff">Barcelona, Catalonia</text>
<line x1="640" y1="152" x2="952" y2="152" stroke="#1f1f1f"/>
</g>
<g class="ln" style="animation-delay:0.60s">
<text x="640.0" y="182.0" font-family="l5" font-size="10.5" fill="#888888" letter-spacing="2.00">COMPANY</text>
<text x="750.0" y="183.0" font-family="b5" font-size="14" fill="#ffffff">Infini · AI consultancy</text>
<line x1="640" y1="200" x2="952" y2="200" stroke="#1f1f1f"/>
</g>
<g class="ln" style="animation-delay:0.70s">
<text x="640.0" y="230.0" font-family="l5" font-size="10.5" fill="#888888" letter-spacing="2.00">FOCUS</text>
<text x="750.0" y="231.0" font-family="b5" font-size="14" fill="#ffffff">Web · AI agents · RPA</text>
<line x1="640" y1="248" x2="952" y2="248" stroke="#1f1f1f"/>
</g>
<g class="ln" style="animation-delay:0.80s">
<text x="640.0" y="278.0" font-family="l5" font-size="10.5" fill="#888888" letter-spacing="2.00">LANGUAGES</text>
<text x="750.0" y="279.0" font-family="b5" font-size="14" fill="#ffffff">Spanish · English · Catalan</text>
<line x1="640" y1="296" x2="952" y2="296" stroke="#1f1f1f"/>
</g>
<g class="ln" style="animation-delay:0.90s">
<text x="640.0" y="326.0" font-family="l5" font-size="10.5" fill="#888888" letter-spacing="2.00">STATUS</text>
<text x="750.0" y="327.0" font-family="b5" font-size="14" fill="#ffffff">Available for projects</text>
<line x1="640" y1="344" x2="952" y2="344" stroke="#1f1f1f"/>
</g>
</svg>
